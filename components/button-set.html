
<!DOCTYPE html>
<html>
<head>
    <title>Kumpulan Tombol</title>

    <style>
        body {
            background-color: whitesmoke;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #202c45;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: rgb(30, 50, 85);
            color: white;
        }

        .btn-secondary {
            background-color: lightblue;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #344563;
        }

        .btn-send {
            background-color: rgba(230, 145, 65, 1);
            color: white;
        }

        .btn-secondary, .btn-outline {
            color: #202c45;
        }

        .btn-primary:hover {
            background-color: #526b91;
        }

        .btn-secondary:hover {
            background-color: rgb(120, 160, 190);
        }

        .btn-outline:hover {
            background-color: lightgray;
        }

        .btn-send:hover {
            background-color: rgba(180, 100, 35, 1);
        }
    </style>
</head>

<body>

    <main>

        <h2>Kumpulan Tombol</h2>

        <div class="button-group">
            <button class="btn btn-primary">Lihat Proyek</button>
            <button class="btn btn-secondary">Unduh CV</button>
            <button class="btn btn-outline">Hubungi Saya</button>
            <button class="btn btn-send">Kirim Pesan</button>
        </div>

    </main>

    <footer>
        <a href="../pages/profile.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
