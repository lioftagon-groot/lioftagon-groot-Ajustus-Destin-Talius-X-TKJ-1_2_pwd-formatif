
<!DOCTYPE html>
<html>
<head>
    <title>Kumpulan Tombol</title>

    <style>

        /* 1. Selector Tag: body */
        body {
            background-color: whitesmoke;
            font-family: Arial, sans-serif;
        }

        /* 2. Selector Tag: h2 */
        h2 {
            color: #202c45;
            font-size: 20px;
        }

        /* 3. Selector Class: .btn */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }

        /* 4. Selector Descendant */
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* 5. Selector Class: Warna tombol */
        .btn-primary {
            background-color: rgb(30, 50, 85);
            color: white;
        }

        .btn-secondary {
            background-color: lightblue;
        }

        .btn-outline {
            background-color: white;
            border: 2px solid #344563;
        }

        .btn-send {
            background-color: rgba(230, 145, 65, 1);
            color: white;
        }

        /* 6. Selector Grouping */
        .btn-secondary, .btn-outline {
            color: #202c45;
        }

        /* 7. Pseudo-class Hover */
        .btn-primary:hover {
            background-color: #526b91;
        }

        .btn-secondary:hover {
            background-color: rgb(120, 160, 190);
        }

        .btn-outline:hover {
            background-color: lightgray;
        }

        .btn-send:hover {
            background-color: rgba(180, 100, 35, 1);
        }

    </style>
</head>

<body>

    <main>

        <h2>Pilihan</h2>

        <div class="button-group">

                <a href="../components/button-set.html" class="btn btn-primary">
        Lihat Proyek
    </a>

    <a href="../components/button-set.html" class="btn btn-secondary">
        Unduh CV
    </a>

    <a href="../components/button-set.html" class="btn btn-outline">
        Hubungi Saya
    </a>

    <a href="../components/button-set.html" class="btn btn-send">
        Kirim Pesan
    </a>
     
        </div>

    </main>

    <footer>
        <a href="index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
