<!DOCTYPE html>
<html>
<head>
    <title>Hubungi Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f2f5fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #aab8ce;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .contact-form h2 {
            text-align: center;
            color: #203d63;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #c5cbd5;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #4267a5;
            background-color: #edf3fc;
        }

        .form-group textarea:focus {
            border: 2px solid #7651c9;
            background-color: #f5f0ff;
        }

        .form-group textarea {
            height: 110px;
            resize: vertical;
        }

        .btn-submit {
            background-color: #203d63;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #4267a5;
        }

        footer {
            text-align: center;
            padding: 10px;
        }

        footer a {
            color: #7651c9;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <section id="contact">

        <form class="contact-form" action="#" method="post">

            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>

        </form>

    </section>

    <footer>
        <a href="profile.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
